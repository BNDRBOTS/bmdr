    <style>
        :root {
            --glass-black: rgba(0, 0, 0, 0.75);
            --glass-white: rgba(255, 255, 255, 0.75);
            --blur: blur(24px);
            --accent-glow: #00ffcc;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            font-family: 'Inter', sans-serif;
            background: #000;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            user-select: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        [contenteditable], input, textarea, [role="textbox"] { user-select: text; }

        .bg-split {
            position: fixed;
            inset: 0;
            background: linear-gradient(105deg, #e8e8e8 0%, #e8e8e8 50%, #000000 50%, #000000 100%);
            z-index: 0;
        }

        .glass-dark {
            background: var(--glass-black);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
        }

        .glass-light {
            background: var(--glass-white);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease;
        }

        @media (hover: hover) {
            .glass-light:hover {
                box-shadow: 0 40px 80px rgba(0,0,0,0.15);
                transform: translateY(-4px);
            }
        }

        .font-edge { font-family: 'Syncopate', sans-serif; }

        #render-engine {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            touch-action: none;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
            height: 44px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 20px var(--accent-glow);
            cursor: pointer;
            margin-top: -10px;
            transition: transform 0.2s ease;
        }
        input[type=range]::-moz-range-thumb {
            height: 24px;
            width: 24px;
            border: none;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 20px var(--accent-glow);
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.15); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        #settings-sheet {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sheet-closed { transform: translateY(100%); }
        .sheet-open { transform: translateY(0); }

        .hidden-layer { opacity: 0; pointer-events: none; z-index: -1; transition: opacity 0.15s ease-out; }
        .active-layer { opacity: 1; pointer-events: auto; z-index: 20; transition: opacity 0.15s ease-out; }

        .gumroad-button {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1.25rem !important;
            background: #000 !important;
            color: #fff !important;
            border-radius: 9999px !important;
            font-family: 'Syncopate', sans-serif !important;
            font-weight: 700 !important;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            box-shadow: 0 0 30px rgba(0,0,0,0.3) !important;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
            border: 1px solid rgba(255,255,255,0.2) !important;
            position: relative;
            overflow: hidden;
        }
        .gumroad-button::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-20deg);
            pointer-events: none;
        }
        @media (hover: hover) {
            .gumroad-button:hover::after { animation: lightSweep 1.2s ease-out; }
        }
        .gumroad-button:active { transform: scale(0.97) !important; box-shadow: 0 0 10px rgba(0,0,0,0.5) !important; }

        @keyframes lightSweep { 100% { left: 200%; } }

        .skip-link {
            position: absolute;
            top: -100px;
            left: 1rem;
            z-index: 100;
            background: #000;
            color: #fff;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            transition: top 0.2s ease;
        }
        .skip-link:focus { top: 1rem; }

        :focus-visible {
            outline: 2px solid var(--accent-glow);
            outline-offset: 2px;
            border-radius: 4px;
        }

        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <div id="layer-landing" class="fixed inset-0 flex flex-col justify-between p-6 active-layer">
        <header class="relative w-full h-20 flex justify-between items-center z-30">
            <h1 class="font-edge font-bold tracking-widest text-xl text-black">BMDR</h1>

            <a href="https://bndrllc.com" target="_blank" rel="noopener noreferrer" aria-label="Visit BNDR LLC homepage (opens in new tab)" class="opacity-60 hover:opacity-100 focus-visible:opacity-100 transition-all duration-300">
                <img src="https://r2-uploader-production.up.railway.app/files/6a9dd45e-e7a0-4396-a084-5f11b737e92e.png" alt="BNDR LLC - Bilateral Reprocessing Application" width="80" height="20" class="h-5 w-auto object-contain filter brightness-0 invert">
            </a>

        <main class="w-full max-w-md mx-auto flex flex-col justify-center flex-grow z-20">
            <div class="glass-light p-8 rounded-3xl mb-6 relative overflow-hidden group">

                    Begin Personal Practice
                </button>
            </div>
        </main>

        <footer class="w-full flex justify-end pb-6 z-20">
            <div class="w-1/2 text-right pr-2 sm:pr-4 text-white/50 text-[10px] font-edge tracking-[0.2em] uppercase">
                &copy; 2026 BNDR LLC // BEMDR
            </div>

    <div id="layer-workspace" class="fixed inset-0 flex flex-col justify-end hidden-layer" role="region" aria-label="Practice space">

        <div class="absolute inset-0 z-20 cursor-pointer" onclick="Engine.toggleSystem()" aria-hidden="true"></div>

        <div class="absolute top-0 left-0 w-full px-6 h-24 grid grid-cols-3 items-center z-30 pointer-events-none">

            <div class="flex justify-start">
                <button type="button" onclick="Engine.unmountWorkspace()" aria-label="Return to landing page" class="p-3 -ml-3 opacity-50 hover:opacity-100 focus-visible:opacity-100 active:opacity-100 active:scale-95 transition-all text-black pointer-events-auto">
                    <i data-lucide="arrow-left" aria-hidden="true" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex justify-center">
                <div id="status-container" class="glass-dark px-4 py-1.5 rounded-full border border-white/10 pointer-events-auto flex items-center justify-center" role="status" aria-live="polite" aria-atomic="true">
                    <span id="status-text" class="whitespace-nowrap font-edge text-[10px] leading-none tracking-[0.3em] uppercase animate-pulse text-white mt-[1px]">Stillness</span>
                </div>
            </div>

            <div class="flex justify-end">
                <button type="button" id="btn-audio-hud" onclick="Engine.toggleAudio()" aria-label="Toggle audio frequencies" aria-pressed="false" class="p-3 -mr-3 opacity-50 hover:opacity-100 focus-visible:opacity-100 active:opacity-100 active:scale-95 transition-all duration-300 ease-out text-white pointer-events-auto flex items-center justify-center">
                    <i data-lucide="volume-x" id="icon-audio-off" aria-hidden="true" class="w-5 h-5"></i>
                    <i data-lucide="volume-2" id="icon-audio-on" aria-hidden="true" class="w-5 h-5 hidden"></i>
                </button>
            </div>

        </div>

        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-30 flex items-center justify-center pointer-events-none">
            <button type="button" id="btn-master-play" onclick="Engine.toggleSystem()" aria-label="Play bilateral stimulation" class="w-20 h-20 rounded-full border border-white/10 glass-dark flex items-center justify-center transition-all duration-200 active:scale-90 shadow-[0_0_40px_rgba(0,0,0,0.6)] group hover:border-white/30 focus-visible:border-white/60 pointer-events-auto">
                <i data-lucide="play" id="icon-play" aria-hidden="true" class="w-8 h-8 ml-1 text-white opacity-80 group-hover:opacity-100 transition-opacity drop-shadow-[0_0_8px_rgba(255,255,255,0.4)]"></i>
                <i data-lucide="pause" id="icon-pause" aria-hidden="true" class="w-8 h-8 hidden text-white opacity-80 group-hover:opacity-100 transition-opacity drop-shadow-[0_0_8px_rgba(255,255,255,0.4)]"></i>
            </button>
        </div>

        <div class="w-full px-4 pb-8 z-30 flex justify-center pointer-events-none">
            <button type="button" onclick="Engine.toggleSheet()" aria-label="Open session adjustments" aria-expanded="false" aria-controls="settings-sheet" class="glass-dark px-8 py-4 rounded-full text-white font-edge text-xs tracking-widest uppercase flex items-center gap-3 active:scale-95 focus-visible:scale-95 shadow-[0_10px_30px_rgba(0,0,0,0.5)] transition-transform pointer-events-auto">
                <i data-lucide="sliders" aria-hidden="true" class="w-4 h-4"></i> Session Adjustments
            </button>
        </div>

        <div id="settings-sheet" class="absolute bottom-0 left-0 w-full h-[75dvh] glass-dark rounded-t-[40px] z-40 flex flex-col sheet-closed border-t border-white/10" role="dialog" aria-modal="false" aria-label="Session adjustments" aria-hidden="true" inert>
            <div class="w-full p-4 flex justify-center items-center cursor-pointer" onclick="Engine.toggleSheet()" role="button" tabindex="0" aria-label="Drag handle, click to close" id="sheet-handle">
                <div class="w-16 h-1.5 bg-white/20 rounded-full" aria-hidden="true"></div>
            </div>

            <div class="flex-grow overflow-y-auto overscroll-contain px-8 pb-12 space-y-8">
                <div class="flex justify-between items-end mb-8">
                    <h3 class="font-edge text-white text-xl">Session Space</h3>
                    <button type="button" onclick="Engine.toggleSheet()" aria-label="Close session adjustments" class="text-white/50 p-2 active:text-white focus-visible:text-white transition-colors"><i data-lucide="x" aria-hidden="true" class="w-6 h-6"></i></button>
                </div>

                <div class="space-y-4">
                    <label for="param-hz" class="flex justify-between text-white/70 font-edge text-xs tracking-widest">
                        <span>Visual Pace</span>
                        <span id="label-hz" class="text-white" aria-live="polite">1.2</span>
                    </label>
                    <input type="range" id="param-hz" min="0.2" max="3.0" step="0.1" value="1.2" aria-valuemin="0.2" aria-valuemax="3.0" aria-valuenow="1.2" aria-label="Visual pace in hertz">
                </div>

                <div class="flex justify-between items-center py-2">
                    <div>
                        <div class="font-edge text-white text-[11px] tracking-widest">Link Rhythms</div>
                        <div class="text-white/40 text-[10px]">Sync audio to visual pace</div>
                    </div>
                    <button type="button" id="btn-sync-toggle" onclick="Engine.toggleSync()" aria-label="Toggle audio rhythm sync" aria-pressed="true" class="w-12 h-6 rounded-full bg-[var(--accent-glow)] shadow-[0_0_10px_rgba(0,255,204,0.3)] relative transition-colors duration-300">
                        <div id="sync-knob" class="w-4 h-4 bg-black rounded-full absolute top-1 left-[26px] transition-transform duration-300" aria-hidden="true"></div>
                    </button>
                </div>

                <div id="audio-rhythm-control" class="space-y-4 opacity-30 transition-opacity duration-300">
                    <label for="param-audio-hz" class="flex justify-between text-white/70 font-edge text-xs tracking-widest">
                        <span>Audio Pace</span>
                        <span id="label-audio-hz" class="text-white" aria-live="polite">1.2</span>
                    </label>
                    <input type="range" id="param-audio-hz" min="0.2" max="3.0" step="0.1" value="1.2" aria-valuemin="0.2" aria-valuemax="3.0" aria-valuenow="1.2" aria-label="Audio pace in hertz" disabled>
                </div>

                <div class="space-y-4">
                    <label for="param-mass" class="flex justify-between text-white/70 font-edge text-xs tracking-widest">
                        <span>Visual Anchor Size</span>
                        <span id="label-mass" class="text-white" aria-live="polite">60</span>
                    </label>
                    <input type="range" id="param-mass" min="20" max="150" step="5" value="60" aria-valuemin="20" aria-valuemax="150" aria-valuenow="60" aria-label="Visual anchor size in pixels">
                </div>

                <div class="space-y-4">
                    <div class="text-white/70 font-edge text-xs tracking-widest mb-2">Flow Pattern</div>
                    <div class="grid grid-cols-2 gap-4" role="group" aria-label="Flow pattern selection">
                        <button type="button" onclick="Engine.setPath('linear')" id="path-linear" aria-pressed="true" class="py-4 rounded-2xl bg-white text-black font-edge text-[10px] font-bold uppercase transition-all shadow-[0_0_15px_rgba(255,255,255,0.2)] active:scale-95">Gentle Sway</button>
                        <button type="button" onclick="Engine.setPath('lissajous')" id="path-lissajous" aria-pressed="false" class="py-4 rounded-2xl bg-white/10 text-white font-edge text-[10px] font-bold uppercase transition-all hover:bg-white/20 active:scale-95">Infinite Flow</button>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="text-white/70 font-edge text-xs tracking-widest mb-2">Soothing Palette</div>
                    <div class="flex gap-4" role="group" aria-label="Color palette selection">
                        <button type="button" onclick="Engine.setColor('#00ffcc')" aria-label="Teal" aria-pressed="true" class="w-14 h-14 rounded-full bg-[#00ffcc] border-4 border-black shadow-[0_0_20px_#00ffcc] active-color transition-transform active:scale-90"></button>
                        <button type="button" onclick="Engine.setColor('#ff0055')" aria-label="Pink" aria-pressed="false" class="w-14 h-14 rounded-full bg-[#ff0055] border-4 border-transparent opacity-50 transition-transform active:scale-90"></button>
                        <button type="button" onclick="Engine.setColor('#7000ff')" aria-label="Purple" aria-pressed="false" class="w-14 h-14 rounded-full bg-[#7000ff] border-4 border-transparent opacity-50 transition-transform active:scale-90"></button>
                        <button type="button" onclick="Engine.setColor('#ffffff')" aria-label="White" aria-pressed="false" class="w-14 h-14 rounded-full bg-[#ffffff] border-4 border-transparent opacity-50 transition-transform active:scale-90"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        'use strict';

        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
            Engine.init();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && Engine.sys.sheetOpen) {
                Engine.toggleSheet();
            }
        });

        document.getElementById('sheet-handle')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                Engine.toggleSheet();
            }
        });

        /**
         * BMDR Engine — bilateral stimulation controller.
         * Manages the canvas render loop, Web Audio panning graph,
         * and the settings sheet UI state.
         *
         * @namespace Engine
         */
        const Engine = {
            /** @type {{active: boolean, sheetOpen: boolean, audioEnabled: boolean, syncRates: boolean, mode: string}} */
            sys: {
                active: false,
                sheetOpen: false,
                audioEnabled: false,
                syncRates: true,
                mode: 'idle'
            },
            /** @type {{hz: number, audioHz: number, mass: number, path: string, color: string, time: number, audioTime: number}} */
            params: {
                hz: 1.2,
                audioHz: 1.2,
                mass: 60,
                path: 'linear',
                color: '#00ffcc',
                time: 0,
                audioTime: 0
            },
            /** @type {{canvas: HTMLCanvasElement|null, ctx: CanvasRenderingContext2D|null, w: number, h: number, req: number|null, xNorm: number}} */
            gfx: {
                canvas: null,
                ctx: null,
                w: 0,
                h: 0,
                req: null,
                xNorm: 0
            },
            /** @type {{ctx: AudioContext|null, masterGain: GainNode|null, compressor: DynamicsCompressorNode|null, merger: ChannelMergerNode|null, gainL: GainNode|null, gainR: GainNode|null, baseFreq: number, ready: boolean}} */
            audio: {
                ctx: null,
                masterGain: null,
                compressor: null,
                merger: null,
                gainL: null,
                gainR: null,
                baseFreq: 87,
                ready: false
            },

            init() {
                this.gfx.canvas = document.getElementById('render-engine');
                if (!this.gfx.canvas) return;

                this.gfx.ctx = this.gfx.canvas.getContext('2d', { alpha: true });
                if (!this.gfx.ctx) return;

                window.addEventListener('resize', () => this.resize());
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden && this.sys.active) {
                        this.toggleSystem(false);
                    }
                });
                this.resize();
                this.bindUI();
                this.syncAudioHudVisual();
            },

            syncAudioHudVisual() {
                const btnHud = document.getElementById('btn-audio-hud');
                const iconOff = document.getElementById('icon-audio-off');
                const iconOn = document.getElementById('icon-audio-on');
                if (!btnHud || !iconOff || !iconOn) return;

                if (this.sys.audioEnabled) {
                    iconOff.classList.add('hidden');
                    iconOn.classList.remove('hidden');
                    btnHud.setAttribute('aria-pressed', 'true');
                    btnHud.classList.remove('opacity-50', 'text-white');
                    btnHud.style.color = this.params.color;
                    btnHud.style.filter = `drop-shadow(0 0 8px ${this.params.color})`;
                    btnHud.style.transform = 'scale(1.1)';
                } else {
                    iconOff.classList.remove('hidden');
                    iconOn.classList.add('hidden');
                    btnHud.setAttribute('aria-pressed', 'false');
                    btnHud.classList.add('opacity-50', 'text-white');
                    btnHud.style.color = '';
                    btnHud.style.filter = '';
                    btnHud.style.transform = 'scale(1)';
                }
            },

            bindUI() {
                const hz = document.getElementById('param-hz');
                const hzLabel = document.getElementById('label-hz');
                hz.addEventListener('input', (e) => {
                    this.params.hz = parseFloat(e.target.value);
                    hzLabel.textContent = this.params.hz.toFixed(1);
                    hz.setAttribute('aria-valuenow', String(this.params.hz));
                    if (this.sys.syncRates) {
                        this.params.audioHz = this.params.hz;
                        const audioHzEl = document.getElementById('param-audio-hz');
                        const audioHzLabel = document.getElementById('label-audio-hz');
                        audioHzEl.value = String(this.params.hz);
                        audioHzLabel.textContent = this.params.hz.toFixed(1);
                        audioHzEl.setAttribute('aria-valuenow', String(this.params.hz));
                    }
                });

                const audioHz = document.getElementById('param-audio-hz');
                const audioHzLabel = document.getElementById('label-audio-hz');
                audioHz.addEventListener('input', (e) => {
                    if (this.sys.syncRates) this.toggleSync(false);
                    this.params.audioHz = parseFloat(e.target.value);
                    audioHzLabel.textContent = this.params.audioHz.toFixed(1);
                    audioHz.setAttribute('aria-valuenow', String(this.params.audioHz));
                });

                const mass = document.getElementById('param-mass');
                const massLabel = document.getElementById('label-mass');
                mass.addEventListener('input', (e) => {
                    this.params.mass = parseInt(e.target.value, 10);
                    massLabel.textContent = String(this.params.mass);
                    mass.setAttribute('aria-valuenow', String(this.params.mass));
                });
            },

            toggleSync(force) {
                this.sys.syncRates = force !== undefined ? force : !this.sys.syncRates;

                const track = document.getElementById('btn-sync-toggle');
                const knob = document.getElementById('sync-knob');
                const audioBlock = document.getElementById('audio-rhythm-control');
                const audioHzInput = document.getElementById('param-audio-hz');
                track.setAttribute('aria-pressed', String(this.sys.syncRates));

                if (this.sys.syncRates) {
                    track.classList.replace('bg-white/20', 'bg-[var(--accent-glow)]');
                    track.classList.add('shadow-[0_0_10px_rgba(0,255,204,0.3)]');
                    knob.classList.add('translate-x-[22px]', 'bg-black');
                    knob.classList.remove('bg-white', 'translate-x-[26px]');

                    audioBlock.classList.replace('opacity-100', 'opacity-30');
                    audioHzInput.disabled = true;
                    this.params.audioHz = this.params.hz;
                    audioHzInput.value = String(this.params.hz);
                    document.getElementById('label-audio-hz').textContent = this.params.hz.toFixed(1);
                    this.params.audioTime = this.params.time;
                } else {
                    track.classList.replace('bg-[var(--accent-glow)]', 'bg-white/20');
                    track.classList.remove('shadow-[0_0_10px_rgba(0,255,204,0.3)]');
                    knob.classList.remove('translate-x-[22px]', 'translate-x-[26px]', 'bg-black');
                    knob.classList.add('bg-white');

                    audioBlock.classList.replace('opacity-30', 'opacity-100');
                    audioHzInput.disabled = false;
                }
            },

            resize() {
                this.gfx.w = window.innerWidth;
                this.gfx.h = window.innerHeight;
                const dpr = window.devicePixelRatio || 1;
                this.gfx.canvas.width = Math.floor(this.gfx.w * dpr);
                this.gfx.canvas.height = Math.floor(this.gfx.h * dpr);
                this.gfx.ctx.setTransform(1, 0, 0, 1, 0, 0);
                this.gfx.ctx.scale(dpr, dpr);
                if (!this.sys.active) this.render();
            },

            mountWorkspace() {
                document.getElementById('layer-landing').classList.replace('active-layer', 'hidden-layer');
                document.getElementById('layer-workspace').classList.replace('hidden-layer', 'active-layer');
                this.sys.mode = 'workspace';

                if (!this.sys.active) {
                    this.toggleSystem(true);
                } else {
                    this.render();
                }
            },

            unmountWorkspace() {
                if (this.sys.active) this.toggleSystem(false);
                if (this.sys.sheetOpen) this.toggleSheet();
                document.getElementById('layer-workspace').classList.replace('active-layer', 'hidden-layer');
                document.getElementById('layer-landing').classList.replace('hidden-layer', 'active-layer');
                this.sys.mode = 'idle';
            },

            toggleSheet() {
                this.sys.sheetOpen = !this.sys.sheetOpen;
                const sheet = document.getElementById('settings-sheet');
                const trigger = document.querySelector('button[aria-controls="settings-sheet"]');
                if (this.sys.sheetOpen) {
                    sheet.classList.replace('sheet-closed', 'sheet-open');
                    sheet.removeAttribute('aria-hidden');
                    sheet.removeAttribute('inert');
                    sheet.setAttribute('aria-modal', 'true');
                    trigger.setAttribute('aria-expanded', 'true');
                    trigger.setAttribute('aria-label', 'Close session adjustments');
                    const closeBtn = sheet.querySelector('button[aria-label="Close session adjustments"]');
                    if (closeBtn) closeBtn.focus();
                } else {
                    sheet.classList.replace('sheet-open', 'sheet-closed');
                    sheet.setAttribute('aria-hidden', 'true');
                    sheet.setAttribute('inert', '');
                    sheet.setAttribute('aria-modal', 'false');
                    trigger.setAttribute('aria-expanded', 'false');
                    trigger.setAttribute('aria-label', 'Open session adjustments');
                    trigger.focus();
                }
            },

            setPath(type) {
                this.params.path = type;
                const l = document.getElementById('path-linear');
                const i = document.getElementById('path-lissajous');
                const activeCls = 'py-4 rounded-2xl bg-white text-black font-edge text-[10px] font-bold uppercase transition-all shadow-[0_0_15px_rgba(255,255,255,0.2)] active:scale-95';
                const idleCls = 'py-4 rounded-2xl bg-white/10 text-white font-edge text-[10px] font-bold uppercase transition-all hover:bg-white/20 active:scale-95';
                if (type === 'linear') {
                    l.className = activeCls; l.setAttribute('aria-pressed', 'true');
                    i.className = idleCls; i.setAttribute('aria-pressed', 'false');
                } else {
                    l.className = idleCls; l.setAttribute('aria-pressed', 'false');
                    i.className = activeCls; i.setAttribute('aria-pressed', 'true');
                }
                if (!this.sys.active) this.render();
            },

            setColor(hex) {
                this.params.color = hex;
                const btns = document.querySelectorAll('#settings-sheet button[onclick^="Engine.setColor"]');
                btns.forEach(b => {
                    const isMatch = b.getAttribute('onclick').includes(hex);
                    b.setAttribute('aria-pressed', String(isMatch));
                    if (isMatch) {
                        b.classList.add('border-black');
                        b.style.boxShadow = `0 0 20px ${hex}`;
                        b.classList.remove('border-transparent', 'opacity-50');
                    } else {
                        b.style.boxShadow = '';
                        b.classList.remove('border-black');
                        b.classList.add('border-transparent', 'opacity-50');
                    }
                });

                if (this.sys.active) {
                    const statusText = document.getElementById('status-text');
                    statusText.style.color = this.params.color;
                    statusText.style.textShadow = `0 0 10px ${this.params.color}`;
                }

                if (this.sys.audioEnabled) {
                    const btnHud = document.getElementById('btn-audio-hud');
                    if (btnHud) {
                        btnHud.style.color = hex;
                        btnHud.style.filter = `drop-shadow(0 0 8px ${hex})`;
                    }
                }

                if (!this.sys.active) this.render();
            },

            toggleSystem(forceState) {
                this.sys.active = forceState !== undefined ? forceState : !this.sys.active;
                const iPlay = document.getElementById('icon-play');
                const iPause = document.getElementById('icon-pause');
                const btn = document.getElementById('btn-master-play');
                const status = document.getElementById('status-text');

                if (this.sys.active) {
                    iPlay.classList.add('hidden');
                    iPause.classList.remove('hidden');
                    btn.setAttribute('aria-label', 'Pause bilateral stimulation');
                    btn.classList.add('opacity-10');
                    window.setTimeout(() => { if (this.sys.active) btn.classList.replace('opacity-10', 'opacity-0'); }, 1000);

                    status.textContent = 'Flowing';
                    status.classList.remove('animate-pulse', 'text-white');
                    status.style.color = this.params.color;
                    status.style.textShadow = `0 0 10px ${this.params.color}`;

                    if (this.sys.audioEnabled) this.igniteAudio();

                    this.lastTime = performance.now();
                    this.loop();
                } else {
                    iPlay.classList.remove('hidden');
                    iPause.classList.add('hidden');
                    btn.setAttribute('aria-label', 'Play bilateral stimulation');
                    btn.classList.remove('opacity-0', 'opacity-10');

                    status.textContent = 'Stillness';
                    status.classList.add('animate-pulse', 'text-white');
                    status.style.color = '';
                    status.style.textShadow = '';

                    if (this.gfx.req) cancelAnimationFrame(this.gfx.req);

                    if (this.audio.ready && this.audio.masterGain && this.audio.ctx) {
                        try {
                            const now = this.audio.ctx.currentTime;
                            this.audio.masterGain.gain.cancelScheduledValues(now);
                            this.audio.masterGain.gain.setValueAtTime(this.audio.masterGain.gain.value, now);
                            this.audio.masterGain.gain.linearRampToValueAtTime(0, now + 0.3);
                        } catch (err) {
                            console.warn('BMDR: audio ramp-down failed', err);
                        }
                    }
                }
            },

            toggleAudio() {
                this.sys.audioEnabled = !this.sys.audioEnabled;

                if (this.sys.audioEnabled) {
                    if (this.sys.active) this.igniteAudio();
                } else {
                    if (this.audio.ready && this.audio.masterGain && this.audio.ctx) {
                        try {
                            const now = this.audio.ctx.currentTime;
                            this.audio.masterGain.gain.cancelScheduledValues(now);
                            this.audio.masterGain.gain.setValueAtTime(this.audio.masterGain.gain.value, now);
                            this.audio.masterGain.gain.linearRampToValueAtTime(0, now + 0.1);
                        } catch (err) {
                            console.warn('BMDR: audio ramp-down failed', err);
                        }
                    }
                }
                this.syncAudioHudVisual();
            },

            igniteAudio() {
                if (!this.audio.ctx) {
                    try {
                        const ACtx = window.AudioContext || window.webkitAudioContext;
                        if (!ACtx) throw new Error('AudioContext not supported');

                        this.audio.ctx = new ACtx();

                        const comp = this.audio.ctx.createDynamicsCompressor();
                        comp.threshold.value = -24;
                        comp.knee.value = 10;
                        comp.ratio.value = 12;
                        comp.attack.value = 0.003;
                        comp.release.value = 0.25;
                        this.audio.compressor = comp;

                        const master = this.audio.ctx.createGain();
                        master.gain.value = 0;
                        this.audio.masterGain = master;

                        comp.connect(master);
                        master.connect(this.audio.ctx.destination);

                        const coreMix = this.audio.ctx.createGain();
                        coreMix.gain.value = 0.8;

                        const sub = this.audio.ctx.createOscillator();
                        sub.type = 'triangle';
                        sub.frequency.value = this.audio.baseFreq / 2;
                        sub.connect(coreMix);
                        sub.start();

                        const harm = this.audio.ctx.createOscillator();
                        harm.type = 'sine';
                        harm.frequency.value = this.audio.baseFreq * 2;
                        const harmGain = this.audio.ctx.createGain();
                        harmGain.gain.value = 0.4;
                        harm.connect(harmGain);
                        harmGain.connect(coreMix);
                        harm.start();

                        const merger = this.audio.ctx.createChannelMerger(2);
                        this.audio.merger = merger;
                        this.audio.gainL = this.audio.ctx.createGain();
                        this.audio.gainR = this.audio.ctx.createGain();

                        coreMix.connect(this.audio.gainL);
                        coreMix.connect(this.audio.gainR);

                        this.audio.gainL.connect(merger, 0, 0);
                        this.audio.gainR.connect(merger, 0, 1);
                        merger.connect(comp);

                        this.audio.ready = true;
                    } catch (err) {
                        console.error('BMDR: audio engine init failed', err);
                        this.sys.audioEnabled = false;
                        this.audio.ready = false;
                        this.syncAudioHudVisual();
                        return;
                    }
                }

                if (this.audio.ctx.state === 'suspended') {
                    this.audio.ctx.resume().catch(err => console.warn('BMDR: ctx resume failed', err));
                }

                try {
                    const now = this.audio.ctx.currentTime;
                    this.audio.masterGain.gain.cancelScheduledValues(now);
                    this.audio.masterGain.gain.setValueAtTime(this.audio.masterGain.gain.value, now);
                    this.audio.masterGain.gain.linearRampToValueAtTime(1.0, now + 1.5);
                } catch (err) {
                    console.warn('BMDR: audio ramp-up failed', err);
                }
            },

            modulateAudio() {
                if (!this.audio.ready || !this.sys.audioEnabled || !this.audio.ctx) return;

                try {
                    const now = this.audio.ctx.currentTime;
                    let audioPanNorm = 0;
                    if (this.sys.syncRates) {
                        audioPanNorm = this.gfx.xNorm;
                    } else {
                        audioPanNorm = Math.sin(this.params.audioTime);
                    }
                    const volL = Math.max(0, 0.5 - (audioPanNorm * 0.5));
                    const volR = Math.max(0, 0.5 + (audioPanNorm * 0.5));
                    this.audio.gainL.gain.setValueAtTime(volL, now);
                    this.audio.gainR.gain.setValueAtTime(volR, now);
                } catch (err) {
                    console.warn('BMDR: audio modulation failed', err);
                }
            },

            loop() {
                if (!this.sys.active) return;
                const now = performance.now();
                const dt = (now - this.lastTime) / 1000;
                this.lastTime = now;

                this.params.time += dt * this.params.hz * Math.PI;
                if (this.sys.syncRates) {
                    this.params.audioTime = this.params.time;
                } else {
                    this.params.audioTime += dt * this.params.audioHz * Math.PI;
                }

                this.render();
                this.modulateAudio();

                this.gfx.req = requestAnimationFrame(() => this.loop());
            },

            render() {
                const { ctx, w, h } = this.gfx;
                if (!ctx) return;

                ctx.clearRect(0, 0, w, h);

                const cy = h / 2;
                const r = this.params.mass;
                const pad = r + 40;
                const spanX = (w / 2) - pad;

                let x = w / 2;
                let y = cy;

                if (this.sys.active) {
                    if (this.params.path === 'linear') {
                        this.gfx.xNorm = Math.sin(this.params.time);
                        x = (w / 2) + (spanX * this.gfx.xNorm);
                    } else {
                        this.gfx.xNorm = Math.sin(this.params.time);
                        x = (w / 2) + (spanX * this.gfx.xNorm);
                        y = cy + ((h / 4 - pad) * Math.sin(this.params.time * 2));
                    }
                } else {
                    this.gfx.xNorm = 0;
                }

                const isOnWhite = x < (w / 2);

                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);

                ctx.shadowColor = this.params.color;
                ctx.shadowBlur = 60;

                if (isOnWhite) {
                    ctx.fillStyle = '#000';
                    ctx.fill();
                    ctx.lineWidth = 6;
                    ctx.strokeStyle = this.params.color;
                    ctx.stroke();
                } else {
                    ctx.fillStyle = this.params.color;
                    ctx.fill();
                }

                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(x, y, r * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }
        };
    </script>
</body>
