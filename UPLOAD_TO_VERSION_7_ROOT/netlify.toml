[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/_private/app.html"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://r2-uploader-production.up.railway.app; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://bndrllc.gumroad.com; frame-ancestors 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/access.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/terms.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/privacy.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/refunds.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/support.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
